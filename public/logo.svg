<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c584c"/>
      <stop offset="50%" stop-color="#a98467"/>
      <stop offset="100%" stop-color="#adc178"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(240, 234, 210, 0.4)"/>
      <stop offset="100%" stop-color="rgba(240, 234, 210, 0.08)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Card -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="112" height="112" rx="32" fill="none" stroke="rgba(240,234,210,0.4)" stroke-width="2" />

  <!-- Inner Liquid Wallet Glass Layer -->
  <rect x="26" y="32" width="76" height="64" rx="20" fill="url(#glassGrad)" stroke="rgba(240,234,210,0.5)" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Wallet Flap Layer -->
  <path d="M 26 50 C 26 42, 102 42, 102 50 A 12 12 0 0 1 102 62 C 102 70, 26 70, 26 62 Z" fill="rgba(240,234,210,0.15)" stroke="rgba(240,234,210,0.3)" stroke-width="1" />

  <!-- INR (₹) Luminous Symbol -->
  <text x="64" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#f0ead2" filter="url(#glow)">₹</text>

  <!-- Accent Sparkle Dot -->
  <circle cx="92" cy="44" r="5" fill="#dde5b6" />
  <circle cx="92" cy="44" r="2" fill="#14100d" />
</svg>
